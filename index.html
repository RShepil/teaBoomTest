<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Карточка товара Ананасовый улун</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <section class="product-card" aria-labelledby="product-title">
        <div class="product-card__gallery">
          <img
            src="img/product-card.jpg"
            alt="Ананасовый улун"
            class="product-card__image"
            width="600"
            height="600"
          />
          <button
            type="button"
            class="product-card__zoom"
            aria-label="Увеличить изображение"
          >
            <svg
              aria-hidden="true"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
              <line x1="11" y1="8" x2="11" y2="14" />
              <line x1="8" y1="11" x2="14" y2="11" />
            </svg>
          </button>
        </div>

        <div class="product-card__info">
          <div class="product-card__header">
            <div class="product-card__title" id="product-title">
              Ананасовый улун
            </div>

            <div class="product-card__actions">
              <button type="button" class="product-card__review-btn">
                <svg
                  aria-hidden="true"
                  class="product-card__review-icon"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
                  />
                </svg>
                <span class="product-card__review-text">оставить отзыв</span>
              </button>

              <button
                type="button"
                class="product-card__wishlist"
                aria-label="Добавить в избранное"
              >
                <svg
                  aria-hidden="true"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
                  />
                </svg>
              </button>
            </div>
          </div>

          <fieldset class="product-card__packaging">
            <legend class="product-card__packaging-legend">
              Выберите фасовку
            </legend>

            <div class="product-card__packaging-list">
              <div class="product-card__packaging-item">
                <input
                  type="radio"
                  name="packaging"
                  id="pack-100"
                  class="product-card__packaging-input"
                  value="01306"
                  data-id="01306"
                  data-price="326.40"
                  data-old-price="349.20"
                  data-stock="Много"
                  checked
                />
                <label for="pack-100" class="product-card__packaging-tab"
                  >100 г</label
                >
              </div>

              <div class="product-card__packaging-item">
                <input
                  type="radio"
                  name="packaging"
                  id="pack-500"
                  class="product-card__packaging-input"
                  value="01307"
                  data-id="01307"
                  data-price="1432.00"
                  data-old-price="1646.00"
                  data-stock="Много"
                />
                <label for="pack-500" class="product-card__packaging-tab"
                  >500 г</label
                >
              </div>

              <div class="product-card__packaging-item">
                <input
                  type="radio"
                  name="packaging"
                  id="pack-1000"
                  class="product-card__packaging-input"
                  value="01308"
                  data-id="01308"
                  data-price="2064.00"
                  data-old-price="2592.00"
                  data-stock="Много"
                />
                <label for="pack-1000" class="product-card__packaging-tab"
                  >1000 г</label
                >
              </div>

              <div class="product-card__packaging-item">
                <input
                  type="radio"
                  name="packaging"
                  id="pack-5000"
                  class="product-card__packaging-input"
                  value="01309"
                  data-id="01309"
                  data-price="6320.00"
                  data-old-price="8710.00"
                  data-stock="Много"
                />
                <label for="pack-5000" class="product-card__packaging-tab"
                  >5000 г</label
                >
              </div>
            </div>
          </fieldset>

          <div class="product-card__details">
            <div class="product-card__details-row">
              <span class="product-card__details-sku">
                арт:
                <span class="product-card__sku-value" id="detail-sku"
                  >01306</span
                >
              </span>
              <span class="product-card__details-stock">
                наличие:
                <span
                  class="product-card__stock-value product-card__stock-value--available"
                  id="detail-stock"
                >
                  Много
                </span>
              </span>
            </div>

            <div class="product-card__details-prices">
              <span class="product-card__details-price" id="detail-price"
                >326.40 ₽</span
              >
              <span class="product-card__old-price" id="detail-old-price"
                >349.20 ₽</span
              >
            </div>

            <button
              type="button"
              class="product-card__cart-button"
              id="add-to-cart-btn"
            >
              <svg
                aria-hidden="true"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="9" cy="21" r="1" />
                <circle cx="20" cy="21" r="1" />
                <path
                  d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
                />
              </svg>
              <span class="product-card__cart-text">В корзину</span>
            </button>
          </div>

          <div class="product-card__description">
            <div class="product-card__description-title">Описание</div>
            <p class="product-card__description-text">
              Китайский бирюзовый чай, цукаты, натуральные ароматические масла.
              Светлый Фуцзяньский улун с&nbsp;ароматом ананаса.
            </p>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
